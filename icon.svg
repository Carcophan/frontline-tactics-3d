<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>

    <!-- Shield Plate Gradient -->
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Frame -->
  <rect x="16" y="16" width="224" height="224" rx="44" fill="url(#bgGlow)" filter="url(#shadow)" stroke="url(#goldGrad)" stroke-width="4"/>
  <rect x="22" y="22" width="212" height="212" rx="38" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6,4"/>

  <!-- Tactical Reticle / Corner Brackets -->
  <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7">
    <!-- Top Left -->
    <path d="M 36,54 L 36,36 L 54,36"/>
    <!-- Top Right -->
    <path d="M 220,54 L 220,36 L 202,36"/>
    <!-- Bottom Left -->
    <path d="M 36,202 L 36,220 L 54,220"/>
    <!-- Bottom Right -->
    <path d="M 220,202 L 220,220 L 202,220"/>
  </g>

  <!-- Globe / World Domination Centerpiece -->
  <g transform="translate(128, 120)">
    <!-- Globe Outer Ring -->
    <circle r="66" fill="url(#plateGrad)" stroke="url(#cyanGrad)" stroke-width="3" filter="url(#glow)"/>
    <circle r="66" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8"/>

    <!-- Globe Grid Lines (Latitudes & Longitudes) -->
    <ellipse cx="0" cy="0" rx="66" ry="24" fill="none" stroke="#0ea5e9" stroke-width="1.2" opacity="0.35"/>
    <ellipse cx="0" cy="0" rx="66" ry="48" fill="none" stroke="#0ea5e9" stroke-width="1.2" opacity="0.35"/>
    <ellipse cx="0" cy="0" rx="30" ry="66" fill="none" stroke="#0ea5e9" stroke-width="1.2" opacity="0.35"/>
    <line x1="-66" y1="0" x2="66" y2="0" stroke="#0ea5e9" stroke-width="1.2" opacity="0.4"/>
    <line x1="0" y1="-66" x2="0" y2="66" stroke="#0ea5e9" stroke-width="1.2" opacity="0.4"/>

    <!-- Continents Silhouettes Stylized -->
    <!-- North America -->
    <path d="M -42,-40 C -36,-32 -26,-28 -28,-14 C -36,-10 -48,-18 -46,-32 Z" fill="#22c55e" opacity="0.85"/>
    <!-- South America -->
    <path d="M -26,-6 C -20,-2 -18,14 -22,26 C -28,24 -30,8 -26,-6 Z" fill="#eab308" opacity="0.85"/>
    <!-- Europe -->
    <path d="M -4,-42 C 10,-40 18,-30 12,-20 C 4,-20 -2,-32 -4,-42 Z" fill="#3b82f6" opacity="0.85"/>
    <!-- Africa -->
    <path d="M -2,-16 C 14,-14 24,0 18,22 C 8,24 -2,8 -2,-16 Z" fill="#f97316" opacity="0.85"/>
    <!-- Asia -->
    <path d="M 14,-46 C 42,-44 54,-24 46,-6 C 34,-12 20,-28 14,-46 Z" fill="#ef4444" opacity="0.85"/>
    <!-- Australia -->
    <path d="M 32,18 C 44,16 48,28 38,34 C 30,32 30,22 32,18 Z" fill="#a855f7" opacity="0.85"/>

    <!-- Tactical Target Markers -->
    <circle cx="-32" cy="-24" r="3.5" fill="#ef4444"/>
    <circle cx="28" cy="-28" r="3.5" fill="#ef4444"/>
    <circle cx="10" cy="4" r="3.5" fill="#ef4444"/>

    <!-- Crossed Combat Swords in background/foreground -->
    <g stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" fill="none">
      <line x1="-54" y1="54" x2="54" y2="-54"/>
      <line x1="-60" y1="48" x2="-48" y2="60" stroke-width="4.5"/>
      <line x1="54" y1="54" x2="-54" y2="-54"/>
      <line x1="48" y1="60" x2="60" y2="48" stroke-width="4.5"/>
    </g>

    <!-- 3D Tactical Die / Cube at center -->
    <g transform="translate(0, 4) scale(0.9)">
      <!-- Top Face -->
      <polygon points="0,-24 22,-12 0,0 -22,-12" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
      <!-- Right Face -->
      <polygon points="22,-12 22,14 0,26 0,0" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
      <!-- Left Face -->
      <polygon points="-22,-12 0,0 0,26 -22,14" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
      <!-- Dots -->
      <!-- Top Face Dot -->
      <circle cx="0" cy="-12" r="2.5" fill="#ef4444"/>
      <!-- Left Face Dots -->
      <circle cx="-11" cy="4" r="2" fill="#0f172a"/>
      <circle cx="-11" cy="14" r="2" fill="#0f172a"/>
      <!-- Right Face Dots -->
      <circle cx="11" cy="2" r="2" fill="#0f172a"/>
      <circle cx="11" cy="10" r="2" fill="#0f172a"/>
      <circle cx="11" cy="18" r="2" fill="#0f172a"/>
    </g>
  </g>

  <!-- Banner / Title Plaque at Bottom -->
  <g transform="translate(128, 212)">
    <rect x="-86" y="-15" width="172" height="26" rx="6" fill="#090d16" stroke="url(#goldGrad)" stroke-width="2"/>
    <text x="0" y="3" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="2">FRONTLINE 3D</text>
  </g>
</svg>

